name: Build and Release Alfred Workflow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: alfred-workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, package, and publish workflow
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write # Required to create releases and upload their assets.
    defaults:
      run:
        shell: bash
    env:
      RELEASE_FILES: "info.plist icon.png LICENSE LICENSE-UTM ATTRIBUTION.md bin/vm-list bin/vm-actions bin/vm-clone-name bin/vm-run lib/utm-common.zsh lib/utm-filter.js"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release version
        id: release
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :version' info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Tag %s does not match workflow version v%s\n' "$GITHUB_REF_NAME" "$version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Validate release sources
        run: |
          /usr/bin/plutil -lint info.plist
          read -r -a release_files <<< "$RELEASE_FILES"
          for file in "${release_files[@]}"; do
            [[ -f "$file" && ! -L "$file" ]]
            case "$file" in
              bin/*|*.zsh) /bin/zsh -n "$file" ;;
              *.js) /usr/bin/osacompile -l JavaScript -o "$RUNNER_TEMP/${file##*/}.scpt" "$file" ;;
            esac
          done

      - name: Package release files
        env:
          WORKFLOW_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          read -r -a release_files <<< "$RELEASE_FILES"
          /usr/bin/zip -X -q "dist/Alfred-UTM-Control-v${WORKFLOW_VERSION}.alfredworkflow" "${release_files[@]}"

      - name: Verify archive and create checksum
        working-directory: dist
        env:
          WORKFLOW_VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact="Alfred-UTM-Control-v${WORKFLOW_VERSION}.alfredworkflow"
          /usr/bin/unzip -t "$artifact"
          /usr/bin/shasum -a 256 "$artifact" > "$artifact.sha256"

      - name: Upload workflow and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Alfred-UTM-Control-v${{ steps.release.outputs.version }}
          path: |
            dist/Alfred-UTM-Control-v${{ steps.release.outputs.version }}.alfredworkflow
            dist/Alfred-UTM-Control-v${{ steps.release.outputs.version }}.alfredworkflow.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          WORKFLOW_VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact="Alfred-UTM-Control-v${WORKFLOW_VERSION}.alfredworkflow"
          gh release create "$RELEASE_TAG" \
            "$artifact" "$artifact.sha256" \
            --verify-tag \
            --title "Alfred-UTM-Control-${RELEASE_TAG}" \
            --generate-notes
